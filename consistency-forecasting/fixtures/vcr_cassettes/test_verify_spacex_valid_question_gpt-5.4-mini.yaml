      [\n    \"reasoning\",\n    \"valid\"\n  ],\n  \"title\": \"VerificationResult\",\n  \"type\":
      \"object\"\n}\n\n        Return a valid JSON instance, not the schema definition."},{"role":"user","content":"\nI''m
      trying to assess the quality of an old forecasting dataset. Here is a forecasting
      question from the dataset: Will SpaceX successfully land humans on Mars by 2030?.
      Please flag questions that don''t sound like binary forecasting questions by
      outputting \"flag\". If it sounds like a reasonable question, output valid is
      True.\n\nTips for identifying good forecasting questions:\n1. The question should
      be binary (answerable with yes/no) and about a future event.\n2. Include a specific
      timeframe or deadline for the event to occur.\n3. The question should have clear,
      objective resolution criteria. Avoid vague words like \"significant\", \"major\",
      \"substantial\", etc., as these are signs of a vague question.\n4. The outcome
      should be verifiable through reliable sources.\n\nExamples of strings that should
      be flagged:\n- Will I finish my homework tonight?\n- Metaculus party 2023\n-
      Will Hell freeze over?\n- Heads or tails\n- Will this video reach 100k views
      by the EOD?\n- Will the US pass significant legislation related to AI in 2028?
      (vague term: \"significant\")\n- Will a major breakthrough in particle physics
      occur before 2028? (vague term: \"major breakthrough\")\n\nExamples of strings
      that should not be flagged:\n- Will Megan Markle and Prince Harry have a baby
      by the end of the year?\n- Will the Brain Preservation Foundation''s Large Mammal
      preservation prize be won by Feb 9th, 2017?\n- Will there be more novel new
      drugs approved by the FDA in 2016 than in 2015?\n\nIf a question is already
      resolved, that doesn''t mean it should be flagged. When in doubt, mark it as
      \"True\".\n\nYour response should take the following structure:\nreasoning:
      { insert your concise thoughts here }\nvalid: { True/False }\n\n\nReturn the
      correct JSON response within a ```json codeblock. not the JSON_SCHEMA"}],"model":"gpt-5.4-mini","temperature":0.5}'
