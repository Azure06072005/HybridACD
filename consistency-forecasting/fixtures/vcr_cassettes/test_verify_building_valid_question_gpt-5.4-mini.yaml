      {\n    \"reasoning\": {\n      \"title\": \"Reasoning\",\n      \"type\": \"string\"\n    },\n    \"valid\":
      {\n      \"title\": \"Valid\",\n      \"type\": \"boolean\"\n    }\n  },\n  \"required\":
      [\n    \"reasoning\",\n    \"valid\"\n  ],\n  \"title\": \"VerificationResult\",\n  \"type\":
      \"object\"\n}\n\n        Return a valid JSON instance, not the schema definition."},{"role":"user","content":"I
      want you to help me validate if a forecasting question (as on sites like Metaculus
      / Manifold) is well defined. \nThe question will ask about an event in the future
      or past.\nThe fields are:\n- title: The title of the question.\n- body: The
      resolution criteria of the question.\n- resolution_date: The date when the outcome
      of the question will be decided.\n\nI want you to validate according to the
      following criteria:\n\n- The resolution date should be consistent with the question.
      In particular:\n   - In case of events that happen at a fixed time (e.g. \"Will
      France win the FIFA World Cup in 2026\"), it should *never* be *before* the
      date when the event is scheduled to happen. Ideally it is exactly at the date.
      There can be *at most a month of leeway* to account for resolution issues and
      delays. If the delay is too long, the question should be marked invalid.\n   -
      In case of events that could resolve at an uncertain date (will Warren Buffet
      die of cancer?), the resolution date should be such that it is highly likely
      the event will happen before it. In this case, the `body` should say the question
      resolves N/A if the resolution date comes and there was no resolution.\n\n-
      The resolution criteria should not be excessively vague or ambiguous, and should
      be consistent with the question.\n\n\nThe format of your response should be:\nreasoning:
      [reasoning here]\nvalid: [True/False]\n\nExample 1:\ntitle: Will Kanye West
      become the president of the United States by 2020?\nbody: This question will
      resolve as Yes if Kanye West is elected as the president of the United States
      before January 1, 2020.\nresolution_date: 2020-01-01 00:00:00\n\n->\n\nreasoning:
      The body (resolution criteria) is clear and consistent with the title.\nvalid:
      True\n\n\nExample 2:\ntitle: Will Kanye West become the president of the United
      States by 2030?\nbody: This question will resolve as Yes if it happens.\nresolution_date:
      2030-01-01 00:00:00\n\n->\n\nreasoning: The body is too vague.\nvalid: False\n\n\nExample
      3:\ntitle: Will Kanye West become the president of the United States before
      January 2030?\nbody: This question will resolve as Yes if Kanye West is elected
      and inaugurated as the president of the United States before January 1, 2030.\nresolution_date:
      2030-01-01 00:00:00\n\n->\n\nreasoning: The resolution criteria are clear and
      consistent with the title.\nThe resolution date is consistent with the title
      and in the future.\nvalid: True\n\n\nExample 4:\ntitle: Will Kanye West become
      the president of the United States by 2030?\nbody: This question will resolve
      as Yes if Kanye West is elected and inaugurated as the president of the United
      States before January 1, 2031.\nresolution_date: 2031-12-01 00:00:00\n\n->\n\nreasoning:
      The resolution date is too late compared to when the body says the question
      will resolve. It is in December 2031, while the body says the question should
      resolve by January 2031.\nvalid: False\n\n\nExample 5:\ntitle: Will any member
      of Kanye West''s family become the president of the United States by 2035?\nbody:
      This question will resolve as Yes if Kanye West or any of his family members
      (including his wife, children, siblings and parents) is elected and... Show
      More\n\nresolution_date: 2035-01-01 00:00:00\n\n->\n\nreasoning: There is a
      \"Show More\" instead of the end of the resolution criteria.\nvalid: False\n\n\nExample
      6:\ntitle: Will a new strain of influenza virus with pandemic potential be identified
      by 2030?\nbody: This question will resolve as Yes if, by December 31, 2030,
      a new strain of influenza virus is identified that meets the following criteria:
      \n- The strain must be genetically distinct from previously identified strains,
      with genetic differences significant enough to be considered a new strain by
      the World Health Organization (WHO) or a similar authoritative body.\n- The
      strain must have demonstrated the ability to cause human infection and have
      the potential for sustained human-to-human transmission.\n- The strain must
      be assessed by the WHO or a similar authoritative body as having pandemic potential,
      meaning it has a significant risk of causing widespread illness across multiple
      countries or continents.\nIn the absence of a formal declaration by the WHO
      or a similar authoritative body, a consensus among at least three leading infectious
      disease research institutions will be considered sufficient for resolution.\nresolution_date:
      2030-12-31 23:59:59\n\n->\n\nreasoning: \"Pandemic potential\" is way too subjective;
      it is not a clearly objective threshold. \nIn the absence of a formal declaration
      by the WHO or a similar authoritative body, a consensus among at least three
      leading infectious disease research institutions will be considered sufficient
      for resolution.\" is not good because it is not clear on what exactly they should
      agree on.\nvalid: False\n\n\nExample 7:\ntitle: Will DeepMind develop an AI
      with the capability to significantly disrupt at least one major industry by
      2030?\nbody: This question will resolve as Yes if, by December 31, 2030, DeepMind
      has developed an artificial intelligence (AI) system that has been publicly
      recognized to significantly disrupt at least one major industry.  The AI system
      must be a primary factor in the disruption, as opposed to a contributing technology
      among others. The industry in question must be one of the following: healthcare,
      automotive, finance, entertainment, or energy. Disruption is considered significant
      if it leads to a change in at least 20%% of the market share within the industry
      or a comparable metric of impact, such as a 20%% increase in efficiency or productivity.
      The resolution will rely on reports and analyses from the specified industry
      sources published by December 31, 2030. In the absence of clear industry consensus,
      a panel of experts from the affected industry may be consulted to determine
      the resolution.\n\n->\n\nreasoning: \"to significantly disrupt at least one
      major industry by 2030\" is too fuzzy. The resolution criteria must be quantifiable.
      \"20%% increase in efficiency or productivity\" is clearly not measurable.\nIn
      addition, we do not want multiple distinct pathways to resolution in a question
      where it is not important there are multiple pathways.\nHere, we have both the
      market share and \"a comparable metric of impact\" as resolution criteria, and
