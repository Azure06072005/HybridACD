    body: '{"messages":[{"role":"system","content":"You are a helpful assistant.\n\n\n        Parse
      the content and return a JSON object matching this schema:\n\n        {\n  \"properties\":
      {\n    \"reasoning\": {\n      \"title\": \"Reasoning\",\n      \"type\": \"string\"\n    },\n    \"valid\":
      {\n      \"title\": \"Valid\",\n      \"type\": \"boolean\"\n    }\n  },\n  \"required\":
      [\n    \"reasoning\",\n    \"valid\"\n  ],\n  \"title\": \"VerificationResult\",\n  \"type\":
      \"object\"\n}\n\n        Return a valid JSON instance, not the schema definition."},{"role":"user","content":"\nI''m
      assessing the quality of the body (resolution criteria) of a forecasting question.
      Here''s the body of the question:\n\nThis question will resolve as Yes if Trump
      successfully lands at least one human on the surface of Mars before January
      1, 2031. The landing must be confirmed by at least two reputable space agencies
      (e.g., NASA, ESA, Roscosmos) or through clear and untampered video evidence
      broadcast live from Mars.\n\nPlease evaluate the body according to the following
      criteria:\n\n1. Clarity: The resolution criteria should be clear and unambiguous.\n2.
      Objectivity: The criteria should be objectively measurable or verifiable.\n3.
      Completeness: All necessary information for resolving the question should be
      included.\n4. Appropriateness: The criteria should not mention market probabilities,
      betting odds, or other inappropriate elements.\n\nExamples of valid bodies:\n-
      This question will resolve as Yes if Kanye West is elected and inaugurated as
      the president of the United States before January 1, 2030.\n- France has last
      won the FIFA World Cup in 2018. This question will resolve as Yes if, by December
      31, 2026, the French national football team (senior, not youth or women''s)
      has won either the FIFA World Cup or the UEFA European Championship.\n\nExamples
      of invalid bodies:\n- This question will resolve as Yes if it happens.\n- {\"resolution_criteria\":
      \"nini\",\"background_info\": \"50% chance. Resolves NO if dismissed, dropped,
      or still in process.\n\nResolves YES if there is a settlement or judgement for
      either side.\n\nhttps://www.politico.com/news/2024/06/17/george-norcross-indictment-new-jersey-corruption-00163700\n\n[image]\"}\n-
      This question will resolve as Yes if, by December 31, 2030, a new strain of
      influenza virus is identified that meets the following criteria: \n  - The strain
      must be genetically distinct from previously identified strains, with genetic
      differences significant enough to be considered a new strain by the World Health
      Organization (WHO) or a similar authoritative body.\n  - The strain must have
      demonstrated the ability to cause human infection and have the potential for
      sustained human-to-human transmission.\n  - The strain must be assessed by the
      WHO or a similar authoritative body as having pandemic potential, meaning it
      has a significant risk of causing widespread illness across multiple countries
      or continents.\n  In the absence of a formal declaration by the WHO or a similar
      authoritative body, a consensus among at least three leading infectious disease
      research institutions will be considered sufficient for resolution.\n\nIssues
      to flag:\n- Vague or subjective terms without clear definitions\n- Inconsistencies
      between the body and the title\n- Inconsistencies within the body itself\n-
      Missing crucial information needed for resolution\n- Multiple distinct pathways
      to resolution that aren''t all important for the question\n- Any mention of
      market probabilities, betting odds, or similar concepts\n- Spurious words or
      irrelevant information in the body\n- Use of external links or images that are
      crucial for understanding the resolution criteria\n- Overly complex or ambiguous
      resolution criteria\n\nSome exceptions to the above:\n- It is okay to have subjective
      terms if the resolution criteria references a specific source to be taken into
      account. For example, in a question \"Will a woman win the Nobel Prize in Physics
      by 2030?\", the preferred way to define \"woman\" is to say \"described by the
      Nobel Prize committee as a woman\".\n- It is sometimes okay to have vague terms
      if the question immediately clarifies an overriding criterium in case of dispute.
      For example, \"In the event of ambiguity in the official documents, a public
      statement from the CEO will be considered authoritative.\"\n\nYour response
      should take the following structure:\nReasoning: { insert your concise evaluation
      here, addressing the criteria above }\nValid: { True if the body meets all criteria,
      False otherwise }\n\nConsider the question as a whole, not just the body. Check
      all the sentences in the body thoroughly.\nFlag only when you have a reason
      to believe the question is not well defined.\n\n\nReturn the correct JSON response
      within a ```json codeblock. not the JSON_SCHEMA"}],"model":"gpt-5.4-mini","temperature":0.5}'
