      to flag:\n- Vague or subjective terms without clear definitions\n- Inconsistencies
      between the body and the title\n- Inconsistencies within the body itself\n-
      Missing crucial information needed for resolution\n- Multiple distinct pathways
      to resolution that aren''t all important for the question\n- Any mention of
      market probabilities, betting odds, or similar concepts\n- Spurious words or
      irrelevant information in the body\n- Use of external links or images that are
      crucial for understanding the resolution criteria\n- Overly complex or ambiguous
      resolution criteria\n\nSome exceptions to the above:\n- It is okay to have subjective
      terms if the resolution criteria references a specific source to be taken into
      account. For example, in a question \"Will a woman win the Nobel Prize in Physics
      by 2030?\", the preferred way to define \"woman\" is to say \"described by the
      Nobel Prize committee as a woman\".\n- It is sometimes okay to have vague terms
      if the question immediately clarifies an overriding criterium in case of dispute.
      For example, \"In the event of ambiguity in the official documents, a public
