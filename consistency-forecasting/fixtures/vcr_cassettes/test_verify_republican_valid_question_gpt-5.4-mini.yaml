      youth or women''s) has won either the FIFA World Cup or the UEFA European Championship.\n\nExamples
      of invalid bodies:\n- This question will resolve as Yes if it happens.\n- {\"resolution_criteria\":
      \"nini\",\"background_info\": \"50% chance. Resolves NO if dismissed, dropped,
      or still in process.\n\nResolves YES if there is a settlement or judgement for
      either side.\n\nhttps://www.politico.com/news/2024/06/17/george-norcross-indictment-new-jersey-corruption-00163700\n\n[image]\"}\n-
      This question will resolve as Yes if, by December 31, 2030, a new strain of
      influenza virus is identified that meets the following criteria: \n  - The strain
      must be genetically distinct from previously identified strains, with genetic
      differences significant enough to be considered a new strain by the World Health
