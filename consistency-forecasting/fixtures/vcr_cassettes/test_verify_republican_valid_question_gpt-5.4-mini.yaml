      budget increase must be explicitly allocated for space exploration activities,
      including but not limited to manned and unmanned missions, research and development
      of space technologies, and exploration of the Moon, Mars, or other celestial
      bodies.\n\nThe resolution will rely on the official platform document released
      by the Republican Party, as well as any official statements or press releases
      from the party''s leadership. In the event of ambiguity or lack of clarity in
      the official documents, statements from the chairperson of the Republican National
      Committee (RNC) or the party''s presidential nominee will be considered authoritative.\n\nIf
