      or if the platform does not explicitly address NASA''s budget for space exploration,
      the question will resolve as No.\n\nPlease evaluate the body according to the
      following criteria:\n\n1. Clarity: The resolution criteria should be clear and
      unambiguous.\n2. Objectivity: The criteria should be objectively measurable
      or verifiable.\n3. Completeness: All necessary information for resolving the
      question should be included.\n4. Appropriateness: The criteria should not mention
      market probabilities, betting odds, or other inappropriate elements.\n\nExamples
      of valid bodies:\n- This question will resolve as Yes if Kanye West is elected
      and inaugurated as the president of the United States before January 1, 2030.\n-
      France has last won the FIFA World Cup in 2018. This question will resolve as
