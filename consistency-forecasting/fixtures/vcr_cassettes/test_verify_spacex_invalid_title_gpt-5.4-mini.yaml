      and about a future event.\n2. Include a specific timeframe or deadline for the
      event to occur.\n3. The question should have clear, objective resolution criteria.
      Avoid vague words like \"significant\", \"major\", \"substantial\", etc., as
      these are signs of a vague question.\n4. The outcome should be verifiable through
      reliable sources.\n\nExamples of strings that should be flagged:\n- Will I finish
      my homework tonight?\n- Metaculus party 2023\n- Will Hell freeze over?\n- Heads
      or tails\n- Will this video reach 100k views by the EOD?\n- Will the US pass
      significant legislation related to AI in 2028? (vague term: \"significant\")\n-
      Will a major breakthrough in particle physics occur before 2028? (vague term:
      \"major breakthrough\")\n\nExamples of strings that should not be flagged:\n-
      Will Megan Markle and Prince Harry have a baby by the end of the year?\n- Will
